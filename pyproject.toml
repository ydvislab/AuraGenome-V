[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trackpilot"
version = "0.1.0"
description = "Choose which genomic foundation-model tracks to trust for a cell type from a few measured variants"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
alphagenome = ["alphagenome==0.10.0"]
test = ["pytest>=7"]

[project.scripts]
trackpilot = "trackpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
